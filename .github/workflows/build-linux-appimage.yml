name: Build Linux AppImage from existing local cache

on:
  workflow_dispatch:
    inputs:
      install_dir:
        description: "Absolute path to the existing Linux TotK install folder (must contain totk-install.json and .setup-temp/gen)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-appimage:
    # This must run on the Linux machine that already has the user's 0.4.0 install cache.
    # Do not change this to ubuntu-latest: GitHub-hosted runners cannot access local game-derived build data.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180

    steps:
      - name: Check out the patched dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Set up Python and .NET
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate existing installation cache
        id: cache
        env:
          INSTALL_DIR: ${{ inputs.install_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          install = Path(os.environ["INSTALL_DIR"]).expanduser()
          if not install.is_absolute():
              raise SystemExit("install_dir must be an absolute path")
          install = install.resolve()
          state_path = install / "totk-install.json"
          temp = install / ".setup-temp"
          gen = temp / "gen"
          build = temp / "build"

          if not install.is_dir():
              raise SystemExit(f"Install folder does not exist: {install}")
          if not state_path.is_file():
              raise SystemExit(f"Missing {state_path}; this does not look like an install made by the 0.4.0 installer.")
          if not (gen / "layout.json").is_file():
              raise SystemExit(
                  f"Missing {gen / 'layout.json'}. The old install's generated-code cache was not retained; "
                  "the AppImage cannot be built from this cache."
              )

          state = json.loads(state_path.read_text(encoding="utf-8"))
          version = state.get("version", "1.2.1")
          tags = {"1.2.1": "v121", "1.4.3": "v143"}
          if version not in tags:
              raise SystemExit(
                  f"This AppImage builder needs a v121 or v143 cache; install records game version {version!r}."
              )

          print(f"version={tags[version]}")
          print(f"install_dir={install}")
          print(f"gen_dir={gen.resolve()}")
          print(f"build_cache={'yes' if build.is_dir() else 'no'}")
          print(f"shader_cache={'yes' if (install / 'shader-cache').is_dir() else 'no'}")
          print(f"Using existing game version {version}; no game dump or prod.keys are uploaded.")
          PY

      - name: Reuse the installed generated-code metadata
        env:
          INSTALL_DIR: ${{ inputs.install_dir }}
          GAME_TAG: ${{ steps.cache.outputs.version }}
          BUILD_CACHE: ${{ steps.cache.outputs.build_cache }}
          SHADER_CACHE: ${{ steps.cache.outputs.shader_cache }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          target="generated/$GAME_TAG"
          if [ -e "$target" ] || [ -L "$target" ]; then
            rm -rf "$target"
          fi
          ln -s "$(realpath "$INSTALL_DIR/.setup-temp/gen")" "$target"
          test -f "$target/layout.json"
          echo "Linked $target to the existing local install cache."
          echo "Existing compile cache: $BUILD_CACHE; existing shader cache: $SHADER_CACHE."

      - name: Check host build tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in make pkg-config tar xz; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing '$tool'. Install the Linux release prerequisites from docs/installer.md."
              exit 1
            fi
          done

      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv/bin/python -r tools/requirements.txt

      - name: Build Linux setup AppImage
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/make_release_linux.py \
            --out build/release/TotK-Setup-linux \
            --appimage build/release/TotK-Setup-x86_64.AppImage
          test -s build/release/TotK-Setup-x86_64.AppImage
          chmod +x build/release/TotK-Setup-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup-x86_64-${{ github.sha }}
          path: build/release/TotK-Setup-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
