name: Build Linux AppImage (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit to build (must contain the ability_guard fix)"
        required: true
        default: "dev"
        type: string

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the ability_guard fix is included
        shell: bash
        run: |
          set -euo pipefail
          FIX=e6839387fcfdcb045c8a38054854cfabfd098f5d
          git merge-base --is-ancestor "$FIX" HEAD || {
            echo "::error::The selected source ref does not contain commit $FIX (ability_guard fix)."
            exit 1
          }
          echo "Building $(git rev-parse HEAD)"
          echo "Contains ability_guard fix $FIX"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential binutils pkg-config make tar xz-utils git curl zlib1g-dev xvfb xauth fonts-dejavu-core mesa-vulkan-drivers vulkan-tools

      - name: Fetch pinned reference projects
        shell: bash
        run: |
          set -euo pipefail
          bash tools/fetch_refs.sh

      - name: Restore release download cache
        uses: actions/cache@v4
        with:
          path: toolchain/release-dl
          key: linux-release-downloads-v1-${{ hashFiles('tools/make_release_linux.py', 'tools/make_release.py') }}
          restore-keys: |
            linux-release-downloads-v1-

      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv/bin/python -r tools/requirements.txt

      - name: Create game-independent runtime layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected_path = Path("tools/data/expected-v1.2.1.json")
          expected = json.loads(expected_path.read_text(encoding="utf-8"))
          hashes = expected["exefs_sha256"]

          # The prebuilt runtime library does not contain lifted game code. Its only generated-layout
          # dependencies are MOD_COUNT and MOD_MAIN_BASE, which the project documents as identical
          # between 1.2.1 and 1.4.3. Use the public module order and the fixed guest base; dummy sizes
          # are only for the temporary metadata read by --make-runtime-lib and are never compiled into
          # the library or included in the AppImage.
          order = ["main", *[f"subsdk{i}" for i in range(10)], "sdk"]
          names = [name for name in order if name in hashes]
          if names != ["main", "subsdk0", "sdk"]:
              raise SystemExit(f"Unexpected 1.2.1 module set: {names!r}")

          first_base = 0x7000000000
          align = 0x200000
          modules = []
          base = first_base
          for name in names:
              size = 1
              modules.append({
                  "name": name,
                  "base": f"{base:#x}",
                  "size": f"{size:#x}",
              })
              base = (base + size + align - 1) & ~(align - 1)

          out = Path("generated/v121")
          out.mkdir(parents=True, exist_ok=True)
          (out / "layout.json").write_text(
              json.dumps(modules, indent=1) + "\n", encoding="utf-8"
          )

          lines = [
              "// Temporary game-independent layout for building libtotkrt; not game code.",
              "#pragma once",
              "",
          ]
          for module in modules:
              macro = module["name"].upper()
              lines.append(f"#define MOD_{macro}_BASE {module['base']}ull")
              lines.append(f"#define MOD_{macro}_SIZE {module['size']}ull")
          lines.extend([
              "",
              f"#define MOD_COUNT {len(modules)}",
              "#define MOD_LIST(X) " + " ".join(
                  f"X({m['name']}, {m['name'].upper()})" for m in modules
              ),
              "",
          ])
          (out / "layout.h").write_text("\n".join(lines), encoding="utf-8")
          print("Prepared temporary, game-independent runtime layout:")
          print(f"  modules={names}")
          print(f"  MOD_COUNT={len(names)}")
          print(f"  MOD_MAIN_BASE={first_base:#x}")
          PY

      - name: Build Linux setup AppImage
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a .venv/bin/python tools/make_release_linux.py \
            --out build/release/TotK-Setup-linux \
            --appimage build/release/TotK-Setup-x86_64.AppImage
          test -s build/release/TotK-Setup-x86_64.AppImage
          test ! -e build/release/TotK-Setup-linux/generated
          chmod +x build/release/TotK-Setup-x86_64.AppImage
          file build/release/TotK-Setup-x86_64.AppImage
          sha256sum build/release/TotK-Setup-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup-x86_64-${{ github.sha }}
          path: build/release/TotK-Setup-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
